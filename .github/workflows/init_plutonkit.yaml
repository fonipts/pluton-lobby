name: Install Pluton Kit

on: [push]

jobs:
  install-pluton-kit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Add submodule to custom folder
      run: |
        # Replace 'script/package' with your desired path
        git submodule add -b feature/1.0.32a1/draft-enhancement --name pluton-kit \
          https://github.com/fonipts/pluton-kit.git ./script/package/pluton-kit
        git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # Adjust version as needed

    - name: Install dependencies
      working-directory: ./script/package/pluton-kit
      run: |
        python -m pip install --upgrade pip
        pip install -e .  # For editable install
        # OR if it uses requirements.txt:
        pip install -r requirements.txt
    - name: Test the bluprint creation
      working-directory: ./test
      run: |
        python ../script/cmd.py
        rm -rf *