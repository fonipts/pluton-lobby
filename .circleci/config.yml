# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
executors:
  default_image:
    docker:
    - image: circleci/python:3
jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      # Checkout the code as the first step.
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"
  build:
    docker:
    - image: circleci/python:3
    steps:
    - checkout
    - run:
        name: Install dependencies
        command: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  install-pluton-kit:
    executor: default_image
    steps:
    - checkout
    - run:
        name: Add submodule to custom folder
        command: |
          git submodule add -b feature/1.0.32a1/draft-enhancement --name pluton-kit https://github.com/fonipts/pluton-kit.git ./script/package/pluton-kit
          git submodule update --init --recursive
    - run:
        command: |
          python -m pip install --upgrade pip
          cd ./script/package/pluton-kit
          pip install -e .
          pip install -r requirements.txt
          cd ../../../test
          python ../script/cmd.py flask1
          python ../script/cmd.py flask2
          python ../script/cmd.py bottle1
          
    - run:
        name:  FastAPI
        command: |
          python ../script/cmd.py fastapi1
          pkill -f "uvicorn" || true
    - run:
        name:  FastAPI 2
        command: |
          python ../script/cmd.py fastapi2
          kill -f "uvicorn" || true
    - run:
        command: |
          python ../script/cmd.py django1
    - run:
        name: Clean bluprint test folder
        command: |
          rm -rf *        
# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  say-hello-workflow: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - say-hello
  CI_CD_Tests:
    jobs:
    - build
  Install_Pluton_Kit:
    jobs:
    - install-pluton-kit
